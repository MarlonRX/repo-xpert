[package]
name = "gadv"
version = "0.0.1"
edition = "2024"
description = "Local, read-only engineering analytics for Git repositories (TUI)"
license = "MIT"
authors = ["Marlon Ramirez <mramirezce14@gmail.com>"]
repository = "https://github.com/MarlonRX/git-advance"
keywords = ["git", "tui", "analytics", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.29.0"
dirs = "6.0.0"
gix = "0.87.1"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1.0"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
